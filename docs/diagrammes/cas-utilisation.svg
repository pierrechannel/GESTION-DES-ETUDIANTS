<text x="500.0" y="335.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#263831" font-weight="normal">Consulter, rechercher</text>
<text x="500.0" y="361.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#263831" font-weight="normal">et filtrer les données</text>
