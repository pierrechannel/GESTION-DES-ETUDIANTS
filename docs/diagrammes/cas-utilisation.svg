<text x="710" y="490.7" text-anchor="start" font-family="Arial, sans-serif" font-size="21" fill="#263831" font-weight="normal">Précondition des opérations de scolarité : session authentifiée.</text>
<text x="710" y="515.9" text-anchor="start" font-family="Arial, sans-serif" font-size="21" fill="#263831" font-weight="normal">L’administrateur possède tous les droits de consultation.</text>
<text x="710" y="541.1" text-anchor="start" font-family="Arial, sans-serif" font-size="21" fill="#263831" font-weight="normal">L’inscription publique crée uniquement le rôle utilisateur.</text>
